<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Agent Chat UI</title>
    <style>
      :root {
        --bg: #f4efe6;
        --surface: #fffcf5;
        --ink: #1f241f;
        --muted: #66706b;
        --line: #d9d2c6;
        --user: #0f766e;
        --assistant: #fff;
        --accent: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Poppins", "Noto Sans SC", "PingFang SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 5%, #ffd5a3 0, transparent 27%),
          radial-gradient(circle at 88% 2%, #b4f1df 0, transparent 33%),
          linear-gradient(180deg, #f4efe6 0%, #eee4d1 100%);
        min-height: 100dvh;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 18px 12px;
      }

      .shell {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(61, 50, 34, 0.08);
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: min(88dvh, 860px);
      }

      .head {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #fffdf7 0%, #f8f2e6 100%);
      }

      h1 {
        margin: 0;
        font-size: clamp(19px, 2.8vw, 28px);
        letter-spacing: 0.2px;
      }

      .sub {
        color: var(--muted);
        margin-top: 4px;
        font-size: 13px;
      }

      .messages {
        padding: 16px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .bubble {
        max-width: min(760px, 92%);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 12px;
        line-height: 1.5;
        animation: fadeIn 180ms ease;
      }

      .bubble.user {
        margin-left: auto;
        background: var(--user);
        color: #fff;
        border-color: #0d6f68;
      }

      .bubble.assistant {
        background: var(--assistant);
        color: var(--ink);
      }

      .text {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .meta {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .stamp {
        opacity: 0.8;
      }

      .composer {
        border-top: 1px solid var(--line);
        padding: 12px;
        background: #fffdf8;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }

      button {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .chip {
        background: #fff4dc;
        border-color: #f1d59d;
        color: #75520f;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
      }

      textarea {
        width: 100%;
        min-height: 78px;
        max-height: 180px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 11px;
        font: inherit;
        outline: none;
        resize: vertical;
      }

      textarea:focus {
        border-color: var(--user);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
      }

      .run {
        background: var(--user);
        color: #fff;
      }

      .ghost {
        background: #eee7d9;
        color: #3d423f;
        border-color: #dfd6c7;
      }

      pre {
        margin: 8px 0 0;
        max-height: 280px;
        overflow: auto;
        background: #101513;
        color: #e5fff7;
        border-radius: 12px;
        padding: 12px;
        font-size: 12px;
        line-height: 1.45;
      }

      details summary {
        cursor: pointer;
        color: #8a5808;
        font-weight: 600;
        margin-top: 8px;
      }

      .actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .action-btn {
        font-size: 11px;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid #e2d8c5;
        background: #faf4e8;
        color: #5f4e2f;
      }

      .typing {
        border-right: 2px solid rgba(0, 0, 0, 0.45);
        animation: caret 0.9s steps(1, end) infinite;
      }

      @keyframes caret {
        50% { border-color: transparent; }
      }

      .result-card {
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fffaf0;
        overflow: hidden;
      }

      .result-head {
        padding: 8px 10px;
        font-size: 12px;
        color: #725015;
        border-bottom: 1px solid #e9d8b6;
        background: #fff1d4;
      }

      .result-body {
        max-height: 220px;
        overflow: auto;
        padding: 8px 10px;
      }

      .result-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 6px;
      }

      .result-list li {
        font-size: 12px;
        padding: 6px 8px;
        border: 1px solid #e7dfd0;
        border-radius: 8px;
        background: #fff;
      }

      .status {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 700px) {
        .wrap {
          padding: 10px;
        }

        .shell {
          height: 92dvh;
        }

        .row {
          grid-template-columns: 1fr;
        }

        .bubble {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="shell">
        <header class="head">
          <h1>Local Agent Chat</h1>
          <p class="sub">现在是聊天模式：默认展示可读回复，技术 JSON 放在详情里。</p>
        </header>

        <section class="messages" id="messages"></section>

        <section class="composer">
          <div class="chips">
            <button class="chip" data-sample="list files">list files</button>
            <button class="chip" data-sample="read README.md">read README.md</button>
            <button class="chip" data-sample="搜索 PlannerConfig">搜索 PlannerConfig</button>
            <button class="chip" data-sample="git status">git status</button>
          </div>

          <div class="row">
            <textarea id="input" placeholder="输入你的指令，按 Enter 发送，Shift+Enter 换行"></textarea>
            <button class="run" id="runBtn">发送</button>
            <button class="ghost" id="clearBtn">清空会话</button>
          </div>
          <div class="status" id="status">就绪</div>
        </section>
      </section>
    </main>

    <script>
      const input = document.getElementById("input");
      const status = document.getElementById("status");
      const runBtn = document.getElementById("runBtn");
      const clearBtn = document.getElementById("clearBtn");
      const messages = document.getElementById("messages");
      const chatHistory = [];

      function addBubble(role, text, options = {}) {
        const { raw = null, withActions = false, retryText = "", typing = false } = options;
        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;

        if (role === "assistant") {
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = `Agent <span class="stamp">· ${formatTime(new Date())}</span>`;
          bubble.appendChild(meta);
        }

        const content = document.createElement("div");
        content.className = "text";
        if (typing) {
          content.classList.add("typing");
        }
        bubble.appendChild(content);

        if (role === "assistant" && raw?.mode === "tool") {
          renderToolCards(bubble, raw?.result);
        }

        let details = null;
        if (raw) {
          details = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = "查看技术详情 (JSON)";
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(raw, null, 2);
          details.appendChild(summary);
          details.appendChild(pre);
          bubble.appendChild(details);
        }

        if (withActions) {
          const actions = document.createElement("div");
          actions.className = "actions";

          const copyBtn = document.createElement("button");
          copyBtn.className = "action-btn";
          copyBtn.textContent = "复制回复";
          copyBtn.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(text);
              copyBtn.textContent = "已复制";
              setTimeout(() => {
                copyBtn.textContent = "复制回复";
              }, 1000);
            } catch {
              copyBtn.textContent = "复制失败";
              setTimeout(() => {
                copyBtn.textContent = "复制回复";
              }, 1000);
            }
          });

          const retryBtn = document.createElement("button");
          retryBtn.className = "action-btn";
          retryBtn.textContent = "重试";
          retryBtn.disabled = !retryText;
          retryBtn.addEventListener("click", () => {
            if (!retryText) return;
            runCommand(retryText, true);
          });

          const toggleBtn = document.createElement("button");
          toggleBtn.className = "action-btn";
          toggleBtn.textContent = "展开详情";
          toggleBtn.disabled = !details;
          toggleBtn.addEventListener("click", () => {
            if (!details) return;
            details.open = !details.open;
            toggleBtn.textContent = details.open ? "收起详情" : "展开详情";
          });

          actions.appendChild(copyBtn);
          actions.appendChild(retryBtn);
          actions.appendChild(toggleBtn);
          bubble.appendChild(actions);
        }

        messages.appendChild(bubble);
        messages.scrollTop = messages.scrollHeight;

        if (typing) {
          typeText(content, text);
        } else {
          content.textContent = text;
        }

        return bubble;
      }

      function typeText(el, text) {
        const chars = Array.from(text);
        let i = 0;
        const tick = () => {
          i += 2;
          el.textContent = chars.slice(0, i).join("");
          messages.scrollTop = messages.scrollHeight;
          if (i < chars.length) {
            requestAnimationFrame(tick);
          } else {
            el.classList.remove("typing");
          }
        };
        requestAnimationFrame(tick);
      }

      function formatTime(date) {
        return date.toLocaleTimeString("zh-CN", {
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function renderToolCards(container, result) {
        const rows = Array.isArray(result?.results) ? result.results : [];

        for (const row of rows) {
          if (!row || typeof row !== "object") continue;
          const data = row.data;
          if (!data || typeof data !== "object") continue;

          if (Array.isArray(data.files)) {
            const card = createListCard("文件列表", data.files, 120);
            container.appendChild(card);
            continue;
          }

          if (Array.isArray(data.matches)) {
            const items = data.matches.map((m) => {
              if (!m || typeof m !== "object") return "(invalid)";
              return `${m.path}:${m.line} ${m.text || ""}`;
            });
            const card = createListCard("搜索命中", items, 80);
            container.appendChild(card);
            continue;
          }

          if (typeof data.path === "string" && typeof data.content === "string") {
            const card = document.createElement("div");
            card.className = "result-card";
            card.innerHTML =
              `<div class="result-head">文件内容预览: ${escapeHtml(data.path)}</div>` +
              `<div class="result-body"><pre>${escapeHtml(data.content.slice(0, 2000))}</pre></div>`;
            container.appendChild(card);
          }
        }
      }

      function createListCard(title, items, limit) {
        const card = document.createElement("div");
        card.className = "result-card";

        const head = document.createElement("div");
        head.className = "result-head";
        const total = items.length;
        const visible = items.slice(0, limit);
        head.textContent = `${title}（显示 ${visible.length} / ${total}）`;

        const body = document.createElement("div");
        body.className = "result-body";
        const ul = document.createElement("ul");
        ul.className = "result-list";

        for (const item of visible) {
          const li = document.createElement("li");
          li.textContent = String(item);
          ul.appendChild(li);
        }

        body.appendChild(ul);
        card.appendChild(head);
        card.appendChild(body);
        return card;
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      async function runCommand(overrideText = "", keepInput = false) {
        const candidate = typeof overrideText === "string" ? overrideText : "";
        const text = (candidate || input.value).trim();
        if (!text) {
          status.textContent = "请输入命令";
          return;
        }

        addBubble("user", text);
        chatHistory.push({ role: "user", content: text });
        if (!keepInput) input.value = "";
        runBtn.disabled = true;
        status.textContent = "执行中...";

        const pending = addBubble("assistant", "正在调用 Agent...");

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              message: text,
              history: chatHistory
            })
          });
          const data = await res.json();

          const summary =
            typeof data?.message === "string"
              ? data.message
              : `执行失败：${data?.error || "unknown"}`;
          pending.remove();
          addBubble("assistant", summary, {
            raw: data,
            withActions: true,
            retryText: text,
            typing: true
          });
          chatHistory.push({ role: "assistant", content: summary });
          status.textContent = res.ok ? "完成" : "失败";
        } catch (err) {
          pending.remove();
          const failText =
            `请求失败：${err instanceof Error ? err.message : String(err)}`;
          addBubble(
            "assistant",
            failText,
            {
              withActions: true,
              retryText: text,
              typing: true
            }
          );
          chatHistory.push({ role: "assistant", content: failText });
          status.textContent = "请求失败";
        } finally {
          runBtn.disabled = false;
          input.focus();
        }
      }

      runBtn.addEventListener("click", () => runCommand());

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          runCommand();
        }
      });

      clearBtn.addEventListener("click", () => {
        messages.innerHTML = "";
        chatHistory.length = 0;
        status.textContent = "会话已清空";
      });

      for (const el of document.querySelectorAll(".chip")) {
        el.addEventListener("click", () => {
          input.value = el.getAttribute("data-sample") || "";
          input.focus();
        });
      }

      addBubble(
        "assistant",
        "你好，我是本地 Agent。你可以像聊天一样输入命令，比如：list files、read README.md、搜索 PlannerConfig。"
      );
    </script>
  </body>
</html>
