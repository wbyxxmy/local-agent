<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Agent Chat UI</title>
    <style>
      :root {
        --bg: #f4efe6;
        --surface: #fffcf5;
        --ink: #1f241f;
        --muted: #66706b;
        --line: #d9d2c6;
        --user: #0f766e;
        --assistant: #fff;
        --accent: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Poppins", "Noto Sans SC", "PingFang SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 5%, #ffd5a3 0, transparent 27%),
          radial-gradient(circle at 88% 2%, #b4f1df 0, transparent 33%),
          linear-gradient(180deg, #f4efe6 0%, #eee4d1 100%);
        min-height: 100dvh;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 18px 12px;
      }

      .shell {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(61, 50, 34, 0.08);
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: min(88dvh, 860px);
      }

      .head {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #fffdf7 0%, #f8f2e6 100%);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        position: relative;
      }

      .head-title {
        flex: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(19px, 2.8vw, 28px);
        letter-spacing: 0.2px;
      }

      .sub {
        color: var(--muted);
        margin-top: 4px;
        font-size: 13px;
      }

      .messages {
        padding: 16px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .bubble {
        max-width: min(760px, 92%);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 12px;
        line-height: 1.5;
        animation: fadeIn 180ms ease;
      }

      .bubble.user {
        margin-left: auto;
        background: var(--user);
        color: #fff;
        border-color: #0d6f68;
      }

      .bubble.assistant {
        background: var(--assistant);
        color: var(--ink);
      }

      .text {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .meta {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .stamp {
        opacity: 0.8;
      }

      .composer {
        border-top: 1px solid var(--line);
        padding: 12px;
        background: #fffdf8;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }

      .app-health {
        position: absolute;
        top: 100%;
        right: 0;
        z-index: 10;
        width: min(480px, calc(100vw - 24px));
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff9ef;
        padding: 10px;
        box-shadow: 0 8px 24px rgba(61, 50, 34, 0.12);
        display: none;
      }

      .app-health.open {
        display: block;
      }

      .head {
        position: relative;
      }

      .app-health-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        color: #6b5d46;
      }

      .app-health-list {
        margin-top: 8px;
        display: grid;
        gap: 6px;
      }

      .app-health-row {
        border: 1px solid #e8dcc8;
        border-radius: 8px;
        background: #fff;
        padding: 8px;
      }

      .app-health-title {
        font-size: 12px;
        font-weight: 700;
        color: #5f4e2f;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .app-grade {
        font-size: 10px;
        border: 1px solid #d8cfbe;
        border-radius: 999px;
        padding: 2px 7px;
        background: #f8f3ea;
      }

      .app-grade.good {
        color: #0f766e;
        border-color: #95d6cb;
        background: #e9f7f4;
      }

      .app-grade.medium {
        color: #8a5808;
        border-color: #f1d59d;
        background: #fff5e0;
      }

      .app-grade.bad {
        color: #8e3f1f;
        border-color: #e5b8a8;
        background: #fff1ec;
      }

      .app-health-item {
        margin-top: 4px;
        font-size: 11px;
        color: #6a6a6a;
      }

      .app-ok {
        color: #0f766e;
      }

      .app-bad {
        color: #8e3f1f;
      }

      button {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .chip {
        background: #fff4dc;
        border-color: #f1d59d;
        color: #75520f;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
      }

      textarea {
        width: 100%;
        min-height: 78px;
        max-height: 180px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 11px;
        font: inherit;
        outline: none;
        resize: vertical;
      }

      textarea:focus {
        border-color: var(--user);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
      }

      .run {
        background: var(--user);
        color: #fff;
      }

      .ghost {
        background: #eee7d9;
        color: #3d423f;
        border-color: #dfd6c7;
      }

      pre {
        margin: 8px 0 0;
        max-height: 280px;
        overflow: auto;
        background: #101513;
        color: #e5fff7;
        border-radius: 12px;
        padding: 12px;
        font-size: 12px;
        line-height: 1.45;
      }

      details summary {
        cursor: pointer;
        color: #8a5808;
        font-weight: 600;
        margin-top: 8px;
      }

      .actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .action-btn {
        font-size: 11px;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid #e2d8c5;
        background: #faf4e8;
        color: #5f4e2f;
      }

      .typing {
        border-right: 2px solid rgba(0, 0, 0, 0.45);
        animation: caret 0.9s steps(1, end) infinite;
      }

      @keyframes caret {
        50% { border-color: transparent; }
      }

      .result-card {
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fffaf0;
        overflow: hidden;
      }

      .result-head {
        padding: 8px 10px;
        font-size: 12px;
        color: #725015;
        border-bottom: 1px solid #e9d8b6;
        background: #fff1d4;
      }

      .result-body {
        max-height: 220px;
        overflow: auto;
        padding: 8px 10px;
      }

      .result-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 6px;
      }

      .result-list li {
        font-size: 12px;
        padding: 6px 8px;
        border: 1px solid #e7dfd0;
        border-radius: 8px;
        background: #fff;
      }

      .status {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }

      .approvals {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      .approval-summary {
        border: 1px solid #f0c98b;
        border-radius: 10px;
        background: #fff7e8;
        padding: 10px;
        font-size: 12px;
        color: #8a5808;
      }

      .approval-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(31, 36, 31, 0.36);
        backdrop-filter: blur(4px);
        z-index: 20;
      }

      .approval-overlay.visible {
        display: flex;
      }

      .approval-panel {
        width: min(720px, 100%);
        max-height: min(78dvh, 760px);
        overflow: auto;
        border: 1px solid #efc17a;
        border-radius: 18px;
        background: #fffdf7;
        box-shadow: 0 24px 64px rgba(46, 34, 15, 0.2);
      }

      .approval-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid #f1dcc0;
        background: linear-gradient(180deg, #fff4dc 0%, #fffaf1 100%);
      }

      .approval-panel-title {
        font-size: 15px;
        font-weight: 700;
        color: #7a4d06;
      }

      .approval-panel-sub {
        margin-top: 2px;
        font-size: 12px;
        color: #7b6542;
      }

      .approval-panel-body {
        padding: 16px;
        display: grid;
        gap: 10px;
      }

      .approval-close {
        background: #fff;
        color: #7b6542;
        border-color: #ead7b5;
      }

      .approval-card {
        border: 1px solid #f0c98b;
        border-radius: 10px;
        background: #fff7e8;
        padding: 10px;
      }

      .approval-title {
        font-size: 12px;
        font-weight: 700;
        color: #8a5808;
      }

      .approval-meta {
        margin-top: 4px;
        font-size: 12px;
        color: #6f5d3f;
        line-height: 1.4;
      }

      .approval-buttons {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .approve {
        background: #0f766e;
        color: #fff;
        border-color: #0d6f68;
      }

      .reject {
        background: #fff;
        color: #8e3f1f;
        border-color: #e5b8a8;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 700px) {
        .wrap {
          padding: 10px;
        }

        .shell {
          height: 92dvh;
        }

        .row {
          grid-template-columns: 1fr;
        }

        .bubble {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="shell">
        <header class="head">
          <div class="head-title">
            <h1>Local Agent Chat</h1>
            <p class="sub">现在是聊天模式：默认展示可读回复，技术 JSON 放在详情里。</p>
          </div>
          <button class="action-btn" id="appHealthToggleBtn" style="white-space:nowrap;margin-top:4px">应用状态</button>
          <div class="app-health" id="appHealth">
            <div class="app-health-head">
              <span id="appHealthMeta">应用启动器状态加载中...</span>
              <button class="action-btn" id="refreshAppsBtn">刷新状态</button>
            </div>
            <div class="app-health-list" id="appHealthList"></div>
          </div>
        </header>

        <section class="messages" id="messages"></section>

        <section class="composer">
          <div class="chips">
            <button class="chip" data-sample="list files">list files</button>
            <button class="chip" data-sample="read README.md">read README.md</button>
            <button class="chip" data-sample="搜索 PlannerConfig">搜索 PlannerConfig</button>
            <button class="chip" data-sample="git status">git status</button>
            <button class="chip" data-sample="打开微信">打开微信</button>
          </div>

          <div class="row">
            <textarea id="input" placeholder="输入你的指令，按 Enter 发送，Shift+Enter 换行"></textarea>
            <button class="run" id="runBtn">发送</button>
            <button class="ghost" id="clearBtn">清空会话</button>
          </div>
          <div class="status" id="status">就绪</div>
          <div class="approvals" id="approvals"></div>
        </section>
      </section>
    </main>

    <div class="approval-overlay" id="approvalOverlay">
      <div class="approval-panel" role="dialog" aria-modal="true" aria-labelledby="approvalPanelTitle">
        <div class="approval-panel-head">
          <div>
            <div class="approval-panel-title" id="approvalPanelTitle">待处理审批</div>
            <div class="approval-panel-sub" id="approvalPanelSub">检测到需要人工确认的操作。</div>
          </div>
          <button class="approval-close" id="approvalCloseBtn">稍后处理</button>
        </div>
        <div class="approval-panel-body" id="approvalModalList"></div>
      </div>
    </div>

    <script>
      const input = document.getElementById("input");
      const status = document.getElementById("status");
      const runBtn = document.getElementById("runBtn");
      const clearBtn = document.getElementById("clearBtn");
      const messages = document.getElementById("messages");
      const approvals = document.getElementById("approvals");
      const approvalOverlay = document.getElementById("approvalOverlay");
      const approvalModalList = document.getElementById("approvalModalList");
      const approvalPanelSub = document.getElementById("approvalPanelSub");
      const approvalCloseBtn = document.getElementById("approvalCloseBtn");
      const appHealthMeta = document.getElementById("appHealthMeta");
      const appHealthList = document.getElementById("appHealthList");
      const refreshAppsBtn = document.getElementById("refreshAppsBtn");
      const appHealthToggleBtn = document.getElementById("appHealthToggleBtn");
      const appHealthPanel = document.getElementById("appHealth");

      appHealthToggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        appHealthPanel.classList.toggle("open");
      });

      document.addEventListener("click", (e) => {
        if (!appHealthPanel.contains(e.target) && e.target !== appHealthToggleBtn) {
          appHealthPanel.classList.remove("open");
        }
      });
      const chatHistory = [];
      let approvalPoller = null;
      let currentSessionId = "";
      let approvalOverlayDismissed = false;
      let awaitingAgentResponse = false;

      function addBubble(role, text, options = {}) {
        const { raw = null, withActions = false, retryText = "", typing = false } = options;
        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;

        if (role === "assistant") {
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = `Agent <span class="stamp">· ${formatTime(new Date())}</span>`;
          bubble.appendChild(meta);
        }

        const content = document.createElement("div");
        content.className = "text";
        if (typing) {
          content.classList.add("typing");
        }
        bubble.appendChild(content);

        if (role === "assistant" && raw?.mode === "tool") {
          renderToolCards(bubble, raw?.result);
        }

        let details = null;
        if (raw) {
          details = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = "查看技术详情 (JSON)";
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(raw, null, 2);
          details.appendChild(summary);
          details.appendChild(pre);
          bubble.appendChild(details);
        }

        if (withActions) {
          const actions = document.createElement("div");
          actions.className = "actions";

          const copyBtn = document.createElement("button");
          copyBtn.className = "action-btn";
          copyBtn.textContent = "复制回复";
          copyBtn.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(text);
              copyBtn.textContent = "已复制";
              setTimeout(() => {
                copyBtn.textContent = "复制回复";
              }, 1000);
            } catch {
              copyBtn.textContent = "复制失败";
              setTimeout(() => {
                copyBtn.textContent = "复制回复";
              }, 1000);
            }
          });

          const retryBtn = document.createElement("button");
          retryBtn.className = "action-btn";
          retryBtn.textContent = "重试";
          retryBtn.disabled = !retryText;
          retryBtn.addEventListener("click", () => {
            if (!retryText) return;
            runCommand(retryText, true);
          });

          const toggleBtn = document.createElement("button");
          toggleBtn.className = "action-btn";
          toggleBtn.textContent = "展开详情";
          toggleBtn.disabled = !details;
          toggleBtn.addEventListener("click", () => {
            if (!details) return;
            details.open = !details.open;
            toggleBtn.textContent = details.open ? "收起详情" : "展开详情";
          });

          actions.appendChild(copyBtn);
          actions.appendChild(retryBtn);
          actions.appendChild(toggleBtn);
          bubble.appendChild(actions);
        }

        messages.appendChild(bubble);
        messages.scrollTop = messages.scrollHeight;

        if (typing) {
          typeText(content, text);
        } else {
          content.textContent = text;
        }

        return bubble;
      }

      function typeText(el, text) {
        const chars = Array.from(text);
        let i = 0;
        const tick = () => {
          i += 2;
          el.textContent = chars.slice(0, i).join("");
          messages.scrollTop = messages.scrollHeight;
          if (i < chars.length) {
            requestAnimationFrame(tick);
          } else {
            el.classList.remove("typing");
          }
        };
        requestAnimationFrame(tick);
      }

      function formatTime(date) {
        return date.toLocaleTimeString("zh-CN", {
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function renderToolCards(container, result) {
        const rows = Array.isArray(result?.results) ? result.results : [];

        for (const row of rows) {
          if (!row || typeof row !== "object") continue;
          const data = row.data;
          if (!data || typeof data !== "object") continue;

          if (Array.isArray(data.files)) {
            const card = createListCard("文件列表", data.files, 120);
            container.appendChild(card);
            continue;
          }

          if (Array.isArray(data.matches)) {
            const items = data.matches.map((m) => {
              if (!m || typeof m !== "object") return "(invalid)";
              return `${m.path}:${m.line} ${m.text || ""}`;
            });
            const card = createListCard("搜索命中", items, 80);
            container.appendChild(card);
            continue;
          }

          if (typeof data.path === "string" && typeof data.content === "string") {
            const card = document.createElement("div");
            card.className = "result-card";
            card.innerHTML =
              `<div class="result-head">文件内容预览: ${escapeHtml(data.path)}</div>` +
              `<div class="result-body"><pre>${escapeHtml(data.content.slice(0, 2000))}</pre></div>`;
            container.appendChild(card);
          }
        }
      }

      function createListCard(title, items, limit) {
        const card = document.createElement("div");
        card.className = "result-card";

        const head = document.createElement("div");
        head.className = "result-head";
        const total = items.length;
        const visible = items.slice(0, limit);
        head.textContent = `${title}（显示 ${visible.length} / ${total}）`;

        const body = document.createElement("div");
        body.className = "result-body";
        const ul = document.createElement("ul");
        ul.className = "result-list";

        for (const item of visible) {
          const li = document.createElement("li");
          li.textContent = String(item);
          ul.appendChild(li);
        }

        body.appendChild(ul);
        card.appendChild(head);
        card.appendChild(body);
        return card;
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function renderAppHealth(data) {
        appHealthList.innerHTML = "";

        if (!data?.ok) {
          appHealthMeta.textContent = `应用状态加载失败: ${data?.error || "unknown"}`;
          return;
        }

        const apps = Array.isArray(data.apps) ? data.apps : [];
        const availableCount = apps.reduce((sum, app) => {
          const launchers = Array.isArray(app.launchers) ? app.launchers : [];
          return sum + launchers.filter((item) => item.available === true).length;
        }, 0);

        appHealthMeta.textContent = `平台: ${data.platform} | 应用: ${apps.length} | 可用启动器: ${availableCount} | ${data.cached ? "缓存" : "实时"}`;

        const sortedApps = [...apps]
          .map((app) => {
            const launchers = Array.isArray(app.launchers) ? app.launchers : [];
            const available = launchers.filter((item) => item.available === true).length;
            const total = launchers.length;
            const ratio = total > 0 ? available / total : 0;
            return { app, launchers, available, total, ratio };
          })
          .sort((a, b) => b.ratio - a.ratio || b.available - a.available || a.app.appId.localeCompare(b.app.appId));

        for (const entry of sortedApps) {
          const { app, launchers, available, total, ratio } = entry;
          const row = document.createElement("div");
          row.className = "app-health-row";

          const title = document.createElement("div");
          title.className = "app-health-title";
          const aliases = Array.isArray(app.aliases) ? app.aliases.join(", ") : "";

          const label = document.createElement("span");
          label.textContent = `${app.appId}${aliases ? ` (${aliases})` : ""}`;

          const badge = document.createElement("span");
          badge.className = "app-grade";
          if (ratio >= 0.8) badge.classList.add("good");
          else if (ratio >= 0.34) badge.classList.add("medium");
          else badge.classList.add("bad");
          badge.textContent = `可用率 ${available}/${total}`;

          title.appendChild(label);
          title.appendChild(badge);
          row.appendChild(title);

          if (launchers.length === 0) {
            const empty = document.createElement("div");
            empty.className = "app-health-item app-bad";
            empty.textContent = "当前平台无启动器配置";
            row.appendChild(empty);
          }

          for (const launcher of launchers) {
            const item = document.createElement("div");
            item.className = `app-health-item ${launcher.available ? "app-ok" : "app-bad"}`;
            const resolved = launcher.resolvedPath ? ` | 路径: ${launcher.resolvedPath}` : "";
            item.textContent = `${launcher.available ? "可用" : "不可用"} | ${launcher.launcher} | ${launcher.detail}${resolved}`;
            row.appendChild(item);

            if (!launcher.available && launcher.repairCommand) {
              const fix = document.createElement("button");
              fix.className = "action-btn";
              fix.textContent = `复制修复命令: ${launcher.repairCommand}`;
              fix.addEventListener("click", async () => {
                try {
                  await navigator.clipboard.writeText(launcher.repairCommand);
                  fix.textContent = "已复制修复命令";
                  setTimeout(() => {
                    fix.textContent = `复制修复命令: ${launcher.repairCommand}`;
                  }, 1000);
                } catch {
                  fix.textContent = "复制失败";
                  setTimeout(() => {
                    fix.textContent = `复制修复命令: ${launcher.repairCommand}`;
                  }, 1000);
                }
              });
              row.appendChild(fix);
            }
          }

          appHealthList.appendChild(row);
        }
      }

      async function refreshAppHealth(force = false) {
        refreshAppsBtn.disabled = true;
        try {
          const qs = new URLSearchParams();
          if (currentSessionId) qs.set("sessionId", currentSessionId);
          if (force) qs.set("refresh", "1");
          const res = await fetch(`/api/apps/status${qs.toString() ? `?${qs.toString()}` : ""}`);
          const data = await res.json().catch(() => ({}));
          renderAppHealth(data);
        } catch (err) {
          renderAppHealth({ ok: false, error: err instanceof Error ? err.message : String(err) });
        } finally {
          refreshAppsBtn.disabled = false;
        }
      }

      async function fetchPendingApprovals() {
        const scopedSessionId = awaitingAgentResponse ? "" : currentSessionId;
        const qs = scopedSessionId
          ? `?sessionId=${encodeURIComponent(scopedSessionId)}`
          : "";
        const res = await fetch(`/api/approvals${qs}`);
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data?.pending) ? data.pending : [];
      }

      async function resolveApproval(id, approved) {
        const res = await fetch(`/api/approvals/${encodeURIComponent(id)}`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ approved })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data?.error || "审批操作失败");
        }
      }

      function hideApprovalOverlay() {
        approvalOverlay.classList.remove("visible");
      }

      function showApprovalOverlay() {
        approvalOverlay.classList.add("visible");
      }

      function createApprovalCard(item) {
        const card = document.createElement("div");
        card.className = "approval-card";

        const title = document.createElement("div");
        title.className = "approval-title";
        title.textContent = `待审批: ${item.toolName}`;

        const meta = document.createElement("div");
        meta.className = "approval-meta";
        meta.textContent = `风险: ${item.riskLevel} | 原因: ${item.reason}`;

        card.appendChild(title);
        card.appendChild(meta);

        if (item.preview !== undefined) {
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(item.preview, null, 2);
          card.appendChild(pre);
        }

        const btns = document.createElement("div");
        btns.className = "approval-buttons";

        const approveBtn = document.createElement("button");
        approveBtn.className = "approve";
        approveBtn.textContent = "通过";

        const rejectBtn = document.createElement("button");
        rejectBtn.className = "reject";
        rejectBtn.textContent = "拒绝";

        approveBtn.addEventListener("click", async () => {
          approveBtn.disabled = true;
          rejectBtn.disabled = true;
          try {
            await resolveApproval(item.id, true);
            status.textContent = "已通过审批，继续执行...";
            await pollApprovalsOnce();
          } catch (err) {
            status.textContent = `审批失败: ${err instanceof Error ? err.message : String(err)}`;
            approveBtn.disabled = false;
            rejectBtn.disabled = false;
          }
        });

        rejectBtn.addEventListener("click", async () => {
          approveBtn.disabled = true;
          rejectBtn.disabled = true;
          try {
            await resolveApproval(item.id, false);
            status.textContent = "已拒绝审批";
            await pollApprovalsOnce();
          } catch (err) {
            status.textContent = `审批失败: ${err instanceof Error ? err.message : String(err)}`;
            approveBtn.disabled = false;
            rejectBtn.disabled = false;
          }
        });

        btns.appendChild(approveBtn);
        btns.appendChild(rejectBtn);
        card.appendChild(btns);
        return card;
      }

      function renderApprovals(pending) {
        approvals.innerHTML = "";
        approvalModalList.innerHTML = "";

        if (!Array.isArray(pending) || pending.length === 0) {
          approvalOverlayDismissed = false;
          hideApprovalOverlay();
          return;
        }

        const summary = document.createElement("div");
        summary.className = "approval-summary";
        summary.textContent = `当前有 ${pending.length} 个待审批操作，请在弹窗中确认。`;
        approvals.appendChild(summary);

        approvalPanelSub.textContent = `检测到 ${pending.length} 个需要人工确认的操作。`;

        for (const item of pending) {
          approvalModalList.appendChild(createApprovalCard(item));
        }

        if (!approvalOverlayDismissed) {
          showApprovalOverlay();
        }
      }

      async function pollApprovalsOnce() {
        try {
          const pending = await fetchPendingApprovals();
          renderApprovals(pending);
          if (pending.length > 0) {
            status.textContent = "等待审批...";
          }
        } catch {
          // Ignore transient polling errors.
        }
      }

      function startApprovalPolling() {
        if (approvalPoller) return;
        pollApprovalsOnce();
        approvalPoller = setInterval(pollApprovalsOnce, 700);
      }

      function stopApprovalPolling() {
        if (!approvalPoller) return;
        clearInterval(approvalPoller);
        approvalPoller = null;
      }

      async function runCommand(overrideText = "", keepInput = false) {
        const candidate = typeof overrideText === "string" ? overrideText : "";
        const text = (candidate || input.value).trim();
        if (!text) {
          status.textContent = "请输入命令";
          return;
        }

        addBubble("user", text);
        chatHistory.push({ role: "user", content: text });
        if (!keepInput) input.value = "";
        runBtn.disabled = true;
        status.textContent = "执行中...";
        approvalOverlayDismissed = false;
        awaitingAgentResponse = true;
        startApprovalPolling();

        const pending = addBubble("assistant", "正在调用 Agent...");

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              message: text,
              history: chatHistory,
              sessionId: currentSessionId || undefined
            })
          });
          const data = await res.json();
          if (typeof data?.sessionId === "string") {
            currentSessionId = data.sessionId;
          }
          awaitingAgentResponse = false;

          const summary =
            typeof data?.message === "string"
              ? data.message
              : `执行失败：${data?.error || "unknown"}`;
          pending.remove();
          addBubble("assistant", summary, {
            raw: data,
            withActions: true,
            retryText: text,
            typing: true
          });
          chatHistory.push({ role: "assistant", content: summary });
          status.textContent = res.ok ? "完成" : "失败";
        } catch (err) {
          awaitingAgentResponse = false;
          pending.remove();
          const failText =
            `请求失败：${err instanceof Error ? err.message : String(err)}`;
          addBubble(
            "assistant",
            failText,
            {
              withActions: true,
              retryText: text,
              typing: true
            }
          );
          chatHistory.push({ role: "assistant", content: failText });
          status.textContent = "请求失败";
        } finally {
          runBtn.disabled = false;
          stopApprovalPolling();
          input.focus();
        }
      }

      runBtn.addEventListener("click", () => runCommand());

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          runCommand();
        }
      });

      clearBtn.addEventListener("click", () => {
        messages.innerHTML = "";
        chatHistory.length = 0;
        currentSessionId = "";
        awaitingAgentResponse = false;
        approvals.innerHTML = "";
        approvalModalList.innerHTML = "";
        approvalOverlayDismissed = false;
        hideApprovalOverlay();
        status.textContent = "会话已清空";
      });

      approvalCloseBtn.addEventListener("click", () => {
        approvalOverlayDismissed = true;
        hideApprovalOverlay();
      });

      approvalOverlay.addEventListener("click", (event) => {
        if (event.target === approvalOverlay) {
          approvalOverlayDismissed = true;
          hideApprovalOverlay();
        }
      });

      refreshAppsBtn.addEventListener("click", () => {
        refreshAppHealth(true);
      });

      startApprovalPolling();
      refreshAppHealth();

      for (const el of document.querySelectorAll(".chip")) {
        el.addEventListener("click", () => {
          input.value = el.getAttribute("data-sample") || "";
          input.focus();
        });
      }

      addBubble(
        "assistant",
        "你好，我是本地 Agent。你可以像聊天一样输入命令，比如：list files、read README.md、搜索 PlannerConfig。"
      );
    </script>
  </body>
</html>
